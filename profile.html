<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Stream · 我的</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/extra.css">
<link rel="stylesheet" href="css/night.css">
<link rel="stylesheet" href="css/myworks.css">
<style>
  .pc-wrap{max-width:1040px;margin:0 auto;padding:30px 26px 70px;display:grid;grid-template-columns:230px 1fr;gap:24px}
  .pc-menu{background:#fff;border-radius:26px;padding:22px 14px;box-shadow:var(--sh-md);height:max-content}
  .pc-menu a{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;
    font-size:14px;color:var(--ink-2);transition:.2s;position:relative}
  .pc-menu a:hover{background:#f6f8fa;color:var(--ink)}
  .pc-menu a.on{color:var(--ink);font-weight:700;background:#f6f8fa}
  .pc-menu a.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
    border-radius:3px;background:var(--orange)}
  .pc-panel{background:#fff;border-radius:26px;padding:32px 34px;box-shadow:var(--sh-md)}
  .pc-panel h1{margin:0 0 26px;font-size:22px}
  .pf-hero{display:flex;align-items:center;gap:20px;margin-bottom:30px}
  .pf-hero .ava{width:92px;height:92px;border-radius:50%;border:4px solid #fff;box-shadow:var(--sh-md)}
  .pf-form .row{margin-bottom:18px}
  .pf-form label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:8px;font-weight:600}
  .pf-form input,.pf-form textarea,.pf-form select{
    width:100%;padding:0 18px;height:50px;border-radius:16px;border:1px solid #e8ebf0;
    background:#fff;font-size:14px;color:var(--ink);transition:.2s;
  }
  .pf-form textarea{height:104px;padding:14px 18px;resize:vertical;line-height:1.7}
  .pf-form input:focus,.pf-form textarea:focus,.pf-form select:focus{
    border-color:var(--orange);box-shadow:0 0 0 4px rgba(249,115,22,.1);
  }
  .pf-form .btn-primary{width:100%;height:52px;margin-top:8px;font-size:15px}
  .sw{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #f4f6f9}
  .sw:last-child{border:none}
  .sw .k{font-size:14px}
  .sw .k small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
  .toggle{width:48px;height:28px;border-radius:99px;background:#e6eaf0;position:relative;transition:.24s;flex:0 0 auto}
  .toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;
    background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.14);transition:.24s}
  .toggle.on{background:linear-gradient(100deg,#14b8a6,#2ec9ba)}
  .toggle.on::after{left:23px}
</style>
<script src="js/hue.js"></script>
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html"><span class="mark">N</span>Nova Stream</a>
  <form class="search" onsubmit="event.preventDefault();location.href='search.html'">
    <span>🔍</span><input type="text" placeholder="搜索视频、创作者、分类">
  </form>
  <nav class="topnav">
    <a href="index.html">首页</a>
    <a href="categories.html">分类</a>
    <a href="creators.html">创作者</a>
    <a href="friends.html">好友</a>
    <a href="upload.html">创作中心</a>
    <a href="profile.html" class="active">我的</a>
  </nav>
    <button class="icon-btn" title="消息">🔔</button>
<a href="profile.html"><img class="avatar ph-1" alt="头像"></a>
</header>

<div class="pc-wrap">
  <aside class="pc-menu">
    <a href="#profile" class="on" data-pane-link="profile">👤 个人资料</a>
    <a href="#works" data-pane-link="works">🎬 我的作品</a>
    <a href="#favs" data-pane-link="favs">⭐ 收藏</a>
    <a href="settings.html">⚙ 账号设置</a>
    <a href="#notis" data-pane-link="notis">🔔 通知<i class="side-dot" id="sideNotiDot"></i></a>
    <a href="feed.html">📣 动态</a>
    <a href="feed.html?type=fans">👥 新粉丝</a>
    <a href="messages.html">✉️ 消息</a>
    <a href="login.html">↩ 退出登录</a>
  </aside>

  <section class="pc-panel" id="profile" data-pane="on">
    <h1>个人资料</h1>
    <div class="pf-hero">
      <div class="ava ph-1" style="border-radius:50%"></div>
      <div>
        <div style="font-size:17px;font-weight:700">子非余</div>
        <div class="tiny" style="margin-top:6px">已观看 128 个视频 · 关注 36 位创作者</div>
      </div>
      <button class="btn btn-ghost" style="height:40px;padding:0 20px;margin-left:auto" onclick="toast('头像上传（演示）')">更换头像</button>
    </div>

    <form class="pf-form" onsubmit="event.preventDefault();toast('资料已保存')">
      <div class="row">
        <label>昵称</label>
        <input type="text" value="子非余">
      </div>
      <div class="row">
        <label>邮箱</label>
        <input type="email" value="hello@novastream.demo">
      </div>
      <div class="row">
        <label>简介</label>
        <textarea>喜欢城市夜景和慢节奏的旅行记录。</textarea>
      </div>
      <div class="row">
        <label>所在地区</label>
        <select><option>中国大陆</option><option>港澳台</option><option>海外</option></select>
      </div>
      <button class="btn btn-primary" type="submit">保存修改</button>
    </form>
  </section>

  <section class="pc-panel" id="works" data-pane style="display:none">
    <div class="mw-head">
      <h1>我的作品</h1>
      <div class="acts">
        <button class="btn btn-ghost" onclick="toast('数据统计面板（演示）')">数据概览</button>
        <a class="btn btn-primary" href="upload.html">＋ 上传新作品</a>
      </div>
    </div>

    <div class="mw-stats">
      <div class="mw-stat"><div class="n">1,284<em>次</em></div><div class="k">总播放</div></div>
      <div class="mw-stat"><div class="n">96<em>条</em></div><div class="k">总留言</div></div>
      <div class="mw-stat"><div class="n">2.4<em>%</em></div><div class="k">完播率</div></div>
      <div class="mw-stat"><div class="n">36<em>位</em></div><div class="k">新增粉丝</div></div>
    </div>

    <div class="mw-tabs" id="mwTabs">
      <button class="on" data-tab="all">全部<span class="cnt">6</span></button>
      <button data-tab="pub">已发布<span class="cnt">3</span></button>
      <button data-tab="rev">审核中<span class="cnt">1</span></button>
      <button data-tab="dft">草稿<span class="cnt">1</span></button>
      <button data-tab="rej">未通过<span class="cnt">1</span></button>
    </div>

    <div class="mw-list" id="mwList"></div>
  </section>

  <section class="pc-panel" id="favs" data-pane style="display:none">
    <div class="mw-head">
      <h1>我的收藏</h1>
      <div class="acts">
        <span class="tiny" id="favCount"></span>
      </div>
    </div>
    <div class="ns-tabs" id="favTabs">
      <button class="on" data-tab="video">视频</button>
      <button data-tab="creator">创作者</button>
    </div>
    <div id="favList"></div>
  </section>

  <section class="pc-panel" id="notis" data-pane style="display:none">
    <div class="mw-head">
      <h1>通知</h1>
      <div class="acts">
        <button class="btn btn-ghost" id="notiClearAll" type="button">全部标为已读</button>
      </div>
    </div>
    <div class="ns-noti-list" id="notiPageList"></div>
  </section>
</div>

<div id="toast" style="position:fixed;left:50%;bottom:40px;translate:-50% 0;padding:11px 20px;border-radius:999px;background:rgba(24,30,42,.88);color:#fff;font-size:13px;opacity:0;transition:.26s;pointer-events:none;z-index:99"></div>

<script>
  let tt;
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg; el.style.opacity = 1;
    clearTimeout(tt); tt = setTimeout(()=>el.style.opacity = 0, 1700);
  }
</script>

<script>
const MY_WORKS = [
  { id:"w1", title:"凌晨三点的城市高架，像一条发光的河", st:"pub", stText:"已发布",
    dur:"08:12", cat:"旅行", date:"2 天前", play:842, cm:61, note:"" },
  { id:"w2", title:"把一张白纸做成杂志封面｜排版思路拆解", st:"pub", stText:"已发布",
    dur:"12:46", cat:"知识", date:"5 天前", play:336, cm:24, note:"" },
  { id:"w3", title:"三个配色原则，让你的作业不再是黑白灰", st:"pub", stText:"已发布",
    dur:"06:33", cat:"知识", date:"上周", play:106, cm:11, note:"" },
  { id:"w4", title:"摸鱼日常：我在工位上养了一缸鱼", st:"rev", stText:"审核中",
    dur:"04:07", cat:"生活", date:"刚刚", play:0, cm:0, note:"预计 30 分钟内完成审核" },
  { id:"w5", title:"没有标题的作品", st:"dft", stText:"草稿",
    dur:"—", cat:"未选择分区", date:"3 天前编辑", play:0, cm:0, note:"封面和视频文件还没补齐" },
  { id:"w6", title:"搬运自某平台的城市夜景合集", st:"rej", stText:"未通过",
    dur:"21:05", cat:"旅行", date:"1 周前", play:0, cm:0, note:"因版权归属不明确未通过，可修改后重新提交" }
];

let curTab = "all";

function renderWorks(){
  const list = document.getElementById("mwList");
  const rows = MY_WORKS.filter(w => curTab === "all" || w.st === curTab);
  if (!rows.length){
    list.innerHTML = '<div class="mw-empty"><div class="ic">🐟</div>这里还空着</div>';
    return;
  }
  list.innerHTML = rows.map((w, idx) => {
    let acts = "";
    if (w.st === "pub") acts = `<button>数据</button><button>编辑</button><button onclick="toast('已下架为草稿')">下架</button><button class="go" onclick="location.href='watch.html'">查看</button>`;
    if (w.st === "rev") acts = `<button class="go" onclick="toast('正在审核，先等等')">看进度</button><button onclick="toast('已撤回为草稿')">撤回</button>`;
    if (w.st === "dft") acts = `<button class="go" onclick="location.href='upload.html'">继续编辑</button><button onclick="toast('草稿已删除')">删除</button>`;
    if (w.st === "rej") acts = `<button class="go" onclick="toast('修改后可重新提交')">修改重提</button><button onclick="toast('申诉已提交')">申诉</button>`;
    const meta = w.st === "dft"
      ? `<span>${w.cat}</span><span>${w.date}</span>`
      : `<span>播放 <b>${w.play}</b></span><span>留言 <b>${w.cm}</b></span><span>分区 ${w.cat}</span><span>${w.date}</span>`;
    return `
      <div class="mw-item">
        <div class="mw-thumb">
          <img src="assets/covers/v${(idx % 64) + 1}.jpg" alt="${w.title}" onerror="this.style.visibility='hidden'">          <span class="st ${w.st}">${w.stText}</span>
          ${w.dur !== "—" ? `<span class="dur">${w.dur}</span>` : ""}
        </div>
        <div class="mw-main">
          <div class="mw-title">${w.title}</div>
          <div class="mw-meta">${meta}</div>
          ${w.note ? `<div class="mw-note">${w.note}</div>` : ""}
        </div>
        <div class="mw-acts">${acts}</div>
      </div>`;
  }).join("");
}

document.getElementById("mwTabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  document.querySelectorAll("#mwTabs button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  curTab = b.dataset.tab;
  renderWorks();
});
renderWorks();

document.querySelectorAll("[data-pane-link]").forEach(a => {
  a.addEventListener("click", e => {
    e.preventDefault();
    const key = a.dataset.paneLink;
    document.querySelectorAll("[data-pane-link]").forEach(x => x.classList.remove("on"));
    a.classList.add("on");
    document.querySelectorAll("[data-pane]").forEach(pane => {
      pane.style.display = pane.id === key ? "" : "none";
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});

if (location.hash === "#works"){
  document.querySelector('[data-pane-link="works"]').click();
}
</script>
<script src="js/data.js"></script>
<script src="js/notify.js"></script>
<script>
  /* ---------- 收藏 / 通知 两个面板 ---------- */
  (function () {
    const FAV_KEY = "ns_favs";
    function getFavs() {
      let v = null;
      try { v = JSON.parse(localStorage.getItem(FAV_KEY)); } catch (e) {}
      if (!v || typeof v !== "object") {
        // 第一次进来给几条示例收藏
        v = {
          video: ["城市夜景延时 · 上海天际线", "山海之间的公路旅行", "下雨天的一杯热可可"],
          creator: ["Maya Chen", "Lila Travels", "Music Vibes"]
        };
        localStorage.setItem(FAV_KEY, JSON.stringify(v));
      }
      if (!Array.isArray(v.video)) v.video = [];
      if (!Array.isArray(v.creator)) v.creator = [];
      return v;
    }
    function setFavs(v) { localStorage.setItem(FAV_KEY, JSON.stringify(v)); }
    window.nsGetFavs = getFavs;
    window.nsSetFavs = setFavs;

    (function loadThumbs() {
      const has = [...document.querySelectorAll("script[src]")].some(s => /js\/data\.js$/.test(s.src));
      if (has || typeof VIDEOS !== "undefined") return;
      const s = document.createElement("script");
      s.src = "js/data.js";
      document.head.appendChild(s);
    })();

    let tab = "video";

    function vRows() {
      const all = (typeof VIDEOS !== "undefined" ? VIDEOS : []);
      return getFavs().video.map(t => all.find(v => v.t === t) || { t: t, c: "", v: "", d: "", ph: 1 });
    }

    function renderFavs() {
      const list = document.getElementById("favList");
      const favs = getFavs();
      document.getElementById("favCount").textContent =
        "共 " + (favs.video.length + favs.creator.length) + " 条";
      if (tab === "video") {
        const rows = vRows();
        list.innerHTML = rows.length ? rows.map(v => `
          <a class="ns-row" href="watch.html?t=${encodeURIComponent(v.t)}&u=${encodeURIComponent(v.c || "")}">
            <div class="ns-thumb"><img src="assets/covers/v${((v.ph - 1) % 64) + 1}.jpg" alt="${v.t}" onerror="this.style.visibility='hidden'"></div>
            <div class="ns-row-main">
              <b>${v.t}</b>
              <span>${v.c ? v.c + " · " + v.v + " 次播放" : "已收藏"}</span>
            </div>
            <button class="ns-row-x" type="button" data-del="video" data-name="${v.t}" title="取消收藏">取消收藏</button>
          </a>`).join("") : '<div class="fd-empty">还没有收藏的视频</div>';
      } else {
        const rows = (typeof CREATORS !== "undefined" ? CREATORS : [])
          .filter(c => favs.creator.includes(c.n));
        list.innerHTML = rows.length ? rows.map(c => `
          <a class="ns-row" href="creator.html?u=${encodeURIComponent(c.n)}">
            <div class="ns-thumb-round ava ph-${c.ph}"></div>
            <div class="ns-row-main">
              <b>${c.n}</b>
              <span>${c.d} · ${c.f} 粉丝</span>
            </div>
            <button class="ns-row-x" type="button" data-del="creator" data-name="${c.n}" title="取消收藏">取消收藏</button>
          </a>`).join("") : '<div class="fd-empty">还没有收藏的创作者</div>';
      }
    }

    document.getElementById("favTabs").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      document.querySelectorAll("#favTabs button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      tab = b.dataset.tab;
      renderFavs();
    });

    document.getElementById("favList").addEventListener("click", e => {
      const b = e.target.closest("[data-del]");
      if (!b) return;
      e.preventDefault();
      e.stopPropagation();
      const favs = getFavs();
      favs[b.dataset.del] = favs[b.dataset.del].filter(x => x !== b.dataset.name);
      setFavs(favs);
      renderFavs();
      if (window.toast) toast("已取消收藏");
    });

    /* 通知页 */
    function renderNotis() {
      const box = document.getElementById("notiPageList");
      const all = window.NS_NOTI || [];
      const read = window.nsNotiRead ? window.nsNotiRead() : [];
      box.innerHTML = all.length ? all.map(n => `
        <a class="ns-noti ${read.includes(n.id) ? "" : "unread"}" href="${n.href || '#'}" data-id="${n.id}">
          <div class="ava ${n.ava}" style="border-radius:50%;width:40px;height:40px;flex:0 0 40px"></div>
          <div class="ns-noti-main">
            <p><b>${n.who}</b> ${n.t}</p>
            <span>${n.time}</span>
          </div>
          ${read.includes(n.id) ? "" : '<i class="n-dot"></i>'}
        </a>`).join("") : '<div class="fd-empty">暂时没有通知</div>';
      const unread = all.filter(n => !read.includes(n.id)).length;
      const dot = document.getElementById("sideNotiDot");
      if (dot) dot.style.display = unread ? "" : "none";
      const cb = document.getElementById("notiClearAll");
      if (cb) cb.style.display = unread ? "" : "none";
    }

    document.getElementById("notiPageList").addEventListener("click", e => {
      const a = e.target.closest("[data-id]");
      if (!a || !window.nsNotiRead) return;
      const read = window.nsNotiRead();
      if (!read.includes(a.dataset.id)) {
        read.push(a.dataset.id);
        window.nsNotiSetRead(read);
        if (window.nsInitNoti) window.nsInitNoti();
      }
      renderNotis();
    });

    document.getElementById("notiClearAll").addEventListener("click", () => {
      if (!window.nsNotiSetRead) return;
      window.nsNotiSetRead((window.NS_NOTI || []).map(n => n.id));
      if (window.nsInitNoti) window.nsInitNoti();
      renderNotis();
    });

    renderFavs();
    renderNotis();
    document.addEventListener("ns:data-ready", renderFavs);

    // 点侧栏时重渲染，数据总是新的
    document.querySelectorAll("[data-pane-link]").forEach(a => {
      a.addEventListener("click", () => {
        if (a.dataset.paneLink === "favs") renderFavs();
        if (a.dataset.paneLink === "notis") renderNotis();
      });
    });

    if (location.hash === "#favs") document.querySelector('[data-pane-link="favs"]').click();
    if (location.hash === "#notis") document.querySelector('[data-pane-link="notis"]').click();
  })();
</script>
<script src="js/notice.js"></script>
</body>
</html>
