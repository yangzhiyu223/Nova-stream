<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Stream · 页面走丢了</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .e404{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 24px;
    background:radial-gradient(700px 420px at 50% 34%,#fff6ef,transparent 62%),linear-gradient(180deg,#fdfefe,#eef2f7)}
  .e404 h1{margin:26px 0 10px;font-size:28px;letter-spacing:.4px}
  .e404 p{margin:0 0 28px;font-size:14px;color:var(--ink-3);line-height:1.9}
  .num{display:flex;align-items:center;justify-content:center;gap:6px;font-size:96px;font-weight:800;
    line-height:1;letter-spacing:2px}
  .num .z{position:relative;width:96px;height:96px;display:grid;place-items:center}
  .num .z .ring{
    width:82px;height:82px;border-radius:50%;
    background:conic-gradient(from 210deg,#f97316 0 62%,#2ec9ba 62% 100%);
    display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800;
    box-shadow:0 16px 34px rgba(249,115,22,.28);
    animation:spin 9s linear infinite;
  }
  .num .z .base{position:absolute;bottom:-6px;width:96px;height:22px;border-radius:50%;
    background:linear-gradient(90deg,#17b3a5,#3fd6c7);filter:blur(.4px);z-index:-1}
  .num .o{background:linear-gradient(120deg,#f97316,#2ec9ba);-webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="e404">
  <div>
    <div class="num">
      <span class="o">4</span>
      <span class="z"><span class="base"></span><span class="ring">✓</span></span>
      <span class="o">4</span>
    </div>
    <h1>哎呀，页面找不到了</h1>
    <p>你要找的内容可能已经删除，或者地址输错了<br>要不先去首页逛逛</p>
    <a class="btn btn-primary" href="index.html">回到首页</a>
  </div>
</div>
<script src="js/notify.js"></script>
<script src="js/notice.js"></script>
</body>
</html>
