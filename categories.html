<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Stream · 分类</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/extra.css">
<style>
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin-top:26px}
  .cat{
    aspect-ratio:1/1.02;border-radius:24px;background:#fff;box-shadow:var(--sh-sm);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    position:relative;transition:.24s;border:1px solid transparent;
  }
  .cat:hover{transform:translateY(-5px);box-shadow:var(--sh-lg);border-color:#ffe2cd}
  .cat .ico{font-size:32px}
  .cat .nm{font-size:15px;font-weight:600}
  .cat .ct{font-size:12px;color:var(--ink-3)}
  .cat .mark{position:absolute;right:14px;top:14px;width:10px;height:10px;border-radius:50%;
    background:var(--orange);opacity:0;transition:.2s}
  .cat:hover .mark{opacity:1}
  .cat.active{border-color:transparent;background:linear-gradient(160deg,#fff7f1,#eefaf8);
    box-shadow:0 18px 40px rgba(20,184,166,.16)}
</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html"><span class="mark">N</span>Nova Stream</a>
  <form class="search" onsubmit="event.preventDefault();location.href='search.html'">
    <span>🔍</span><input type="text" placeholder="浏览分类">
  </form>
  <nav class="topnav">
    <a href="index.html">首页</a>
    <a href="categories.html" class="active">分类</a>
    <a href="creators.html">创作者</a>
    <a href="friends.html">好友</a>
    <a href="upload.html">创作中心</a>
    <a href="profile.html">我的</a>
  </nav>
  <a href="profile.html"><img class="avatar ph-5" alt="头像"></a>
</header>

<div style="max-width:1100px;margin:0 auto;padding:36px 26px 70px">
  <h1 style="margin:0 0 8px;font-size:23px">浏览分类</h1>
  <p class="tiny" style="margin:0">挑一个你感兴趣的方向</p>
  <div class="cat-grid" id="grid"></div>
</div>

<script src="js/data.js"></script>
<script>
  const LIST = [
    {i:"🎮", n:"游戏", c:"1,204 个视频"},
    {i:"🎬", n:"影视", c:"986 个视频"},
    {i:"💻", n:"科技", c:"742 个视频"},
    {i:"🎵", n:"音乐", c:"1,530 个视频"},
    {i:"🌿", n:"生活", c:"2,018 个视频"},
    {i:"🍜", n:"美食", c:"864 个视频"},
    {i:"✈️", n:"旅行", c:"617 个视频"},
    {i:"📚", n:"知识", c:"1,109 个视频"},
    {i:"🏃", n:"运动", c:"438 个视频"},
    {i:"🎨", n:"设计", c:"355 个视频"},
    {i:"🐾", n:"萌宠", c:"702 个视频"},
    {i:"🎧", n:"播客", c:"241 个视频"}
  ];
  document.getElementById("grid").innerHTML = LIST.map(c=>`
    <a class="cat" href="index.html?cat=${encodeURIComponent(c.n)}">
      <span class="mark"></span>
      <div class="ico">${c.i}</div>
      <div class="nm">${c.n}</div>
      <div class="ct">${c.c}</div>
    </a>`).join("");
</script>
<script src="js/notify.js"></script>
</body>
</html>
